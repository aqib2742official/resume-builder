<svg width="820" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 5.5 — ATS Keyword Gap Analysis Flow</text>

  <!-- Inputs -->
  <rect x="30" y="45" width="195" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="127" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Resume Content</text>
  <text x="45" y="82" font-size="8.5" fill="#1e40af">Personal summary, experience bullets,</text>
  <text x="45" y="96" font-size="8.5" fill="#1e40af">skills, certifications, education,</text>
  <text x="45" y="110" font-size="8.5" fill="#1e40af">projects — all combined into plain text</text>
  <text x="45" y="124" font-size="8" fill="#94a3b8">Source: Redux store (live data)</text>

  <rect x="595" y="45" width="195" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="692" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Job Description</text>
  <text x="610" y="82" font-size="8.5" fill="#92400e">Pasted by user into ATS Checker</text>
  <text x="610" y="96" font-size="8.5" fill="#92400e">modal (free text, any format)</text>
  <text x="610" y="124" font-size="8" fill="#94a3b8">Source: user textarea input</text>

  <!-- Step 1: tokenize -->
  <rect x="30" y="165" width="195" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="127" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Step 1 — Tokenize Resume</text>
  <text x="45" y="200" font-size="8.5" fill="#15803d">extractKeywords(resumeText)</text>
  <text x="45" y="214" font-size="8.5" fill="#15803d">Lowercase → strip punct → split</text>
  <text x="45" y="226" font-size="8.5" fill="#15803d">Filter stop words → Set&lt;string&gt;</text>

  <rect x="595" y="165" width="195" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="692" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Step 2 — Tokenize JD</text>
  <text x="610" y="200" font-size="8.5" fill="#15803d">extractKeywords(jobDesc)</text>
  <text x="610" y="214" font-size="8.5" fill="#15803d">Same algorithm → string[ ]</text>
  <text x="610" y="226" font-size="8.5" fill="#15803d">preserves order for scoring</text>

  <!-- Arrows down -->
  <line x1="127" y1="135" x2="127" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="692" y1="135" x2="692" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: compareKeywords -->
  <rect x="230" y="165" width="360" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#5b21b6">Step 3 — compareKeywords(resumeText, jobDesc)</text>
  <text x="245" y="203" font-size="8.5" fill="#6d28d9">matched  = jobKw.filter(k =&gt; resumeSet.has(k))   // found in both</text>
  <text x="245" y="218" font-size="8.5" fill="#6d28d9">missing  = jobKw.filter(k =&gt; !resumeSet.has(k))  // gaps</text>
  <text x="245" y="233" font-size="8.5" fill="#6d28d9">score    = Math.round(matched.length / jobKw.length × 100)</text>
  <text x="245" y="248" font-size="7.5" fill="#94a3b8">lib/atsUtils.ts  —  runs fully client-side (no API call needed for base check)</text>

  <!-- Arrows into Step 3 -->
  <line x1="225" y1="200" x2="230" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="593" y1="200" x2="590" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Groq AI -->
  <rect x="230" y="278" width="360" height="72" rx="8" fill="#fdf2f8" stroke="#a21caf" stroke-width="1.8"/>
  <text x="410" y="297" text-anchor="middle" font-size="10" font-weight="bold" fill="#86198f">Step 4 — Groq AI Semantic Gap (optional)</text>
  <text x="245" y="314" font-size="8.5" fill="#86198f">POST /api/ai  { action: 'ats-gap', resumeText, jobDesc }</text>
  <text x="245" y="329" font-size="8.5" fill="#86198f">Returns: [ "keyword1", "keyword2", ... ] — top 10 contextual gaps</text>
  <text x="245" y="342" font-size="7.5" fill="#94a3b8">AI catches synonyms &amp; paraphrased terms that exact match misses</text>

  <line x1="410" y1="255" x2="410" y2="278" stroke="#a21caf" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Results display -->
  <rect x="30" y="375" width="340" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="393" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">✓ Matched Keywords</text>
  <rect x="45" y="401" width="72" height="18" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="81" y="414" text-anchor="middle" font-size="8" fill="#166534">React</text>
  <rect x="124" y="401" width="72" height="18" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="160" y="414" text-anchor="middle" font-size="8" fill="#166534">TypeScript</text>
  <rect x="203" y="401" width="72" height="18" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="239" y="414" text-anchor="middle" font-size="8" fill="#166534">Node.js</text>
  <rect x="282" y="401" width="72" height="18" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="318" y="414" text-anchor="middle" font-size="8" fill="#166534">REST API</text>
  <text x="45" y="448" font-size="8.5" fill="#15803d">ATS Match Score:</text>
  <rect x="155" y="436" width="120" height="20" rx="10" fill="#16a34a"/>
  <text x="215" y="451" text-anchor="middle" font-size="9" font-weight="bold" fill="white">78% Match ✓</text>
  <text x="290" y="450" font-size="8.5" fill="#15803d">( 14 / 18 keywords )</text>

  <rect x="450" y="375" width="340" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="393" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">✗ Missing Keywords (Add to Resume)</text>
  <rect x="465" y="401" width="90" height="18" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="510" y="414" text-anchor="middle" font-size="8" fill="#7f1d1d">Kubernetes</text>
  <rect x="562" y="401" width="72" height="18" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="598" y="414" text-anchor="middle" font-size="8" fill="#7f1d1d">Docker</text>
  <rect x="641" y="401" width="90" height="18" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="686" y="414" text-anchor="middle" font-size="8" fill="#7f1d1d">CI/CD pipeline</text>
  <rect x="465" y="424" width="80" height="18" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="505" y="437" text-anchor="middle" font-size="8" fill="#7f1d1d">GraphQL</text>
  <text x="465" y="456" font-size="8.5" fill="#991b1b">AI also suggests:  "microservices", "AWS Lambda"</text>

  <!-- Arrow from Step 3/4 to outputs -->
  <line x1="270" y1="350" x2="200" y2="375" stroke="#475569" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="550" y1="350" x2="620" y2="375" stroke="#475569" stroke-width="1.5" marker-end="url(#arrR)"/>
</svg>
