<svg width="820" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="9 0, 0 3.5, 9 7" fill="#475569"/>
    </marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 3.2 — Level-0 Context Diagram</text>

  <!-- Central Process -->
  <ellipse cx="410" cy="195" rx="155" ry="70" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
  <text x="410" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="white">0.0</text>
  <text x="410" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AI-Powered</text>
  <text x="410" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Resume Builder</text>
  <text x="410" y="232" text-anchor="middle" font-size="9.5" fill="#94a3b8">Platform</text>

  <!-- External Entity: End User (left) -->
  <rect x="30" y="155" width="130" height="80" rx="8" fill="#1e3a8a"/>
  <text x="95" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="white">End User</text>
  <text x="95" y="200" text-anchor="middle" font-size="9" fill="#bfdbfe">(Registered /</text>
  <text x="95" y="213" text-anchor="middle" font-size="9" fill="#bfdbfe">Guest)</text>

  <!-- External Entity: Admin (bottom-left) -->
  <rect x="30" y="295" width="130" height="60" rx="8" fill="#991b1b"/>
  <text x="95" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Administrator</text>
  <text x="95" y="337" text-anchor="middle" font-size="9" fill="#fecaca">(Role: admin)</text>

  <!-- External Entity: MongoDB (bottom-right) -->
  <rect x="660" y="280" width="130" height="60" rx="8" fill="#92400e"/>
  <text x="725" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="white">MongoDB Atlas</text>
  <text x="725" y="321" text-anchor="middle" font-size="9" fill="#fef3c7">Cloud Database</text>

  <!-- External Entity: Groq (top-right) -->
  <rect x="660" y="45" width="130" height="60" rx="8" fill="#5b21b6"/>
  <text x="725" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Groq AI API</text>
  <text x="725" y="85" text-anchor="middle" font-size="9" fill="#e9d5ff">LLaMA 3.3 70B</text>

  <!-- External Entity: Remotive (top-left) -->
  <rect x="30" y="45" width="130" height="60" rx="8" fill="#065f46"/>
  <text x="95" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Remotive API</text>
  <text x="95" y="85" text-anchor="middle" font-size="9" fill="#a7f3d0">Remote Jobs</text>

  <!-- ══ Arrows ══ -->
  <!-- End User → System -->
  <line x1="160" y1="185" x2="255" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="195" y="179" font-size="9" fill="#475569">credentials, resume data,</text>
  <text x="195" y="191" font-size="9" fill="#475569">job apps, AI requests</text>

  <!-- System → End User -->
  <line x1="255" y1="205" x2="160" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="195" y="218" font-size="9" fill="#475569">session token, AI content,</text>
  <text x="195" y="228" font-size="9" fill="#475569">PDF download, job listings</text>

  <!-- Admin → System -->
  <line x1="155" y1="318" x2="295" y2="248" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="300" font-size="9" fill="#dc2626">admin actions,</text>
  <text x="200" y="312" font-size="9" fill="#dc2626">user management</text>

  <!-- System → Admin -->
  <line x1="285" y1="255" x2="145" y2="312" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="175" y="268" font-size="9" fill="#dc2626">platform stats,</text>
  <text x="175" y="280" font-size="9" fill="#dc2626">activity reports</text>

  <!-- System → Groq -->
  <line x1="560" y1="158" x2="660" y2="90" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="605" y="118" font-size="9" fill="#7c3aed">AI prompts</text>

  <!-- Groq → System -->
  <line x1="660" y1="98" x2="565" y2="165" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="608" y="143" font-size="9" fill="#7c3aed">generated text / JSON</text>

  <!-- System → MongoDB -->
  <line x1="560" y1="235" x2="660" y2="295" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="605" y="272" font-size="9" fill="#ca8a04">read / write</text>

  <!-- MongoDB → System -->
  <line x1="660" y1="305" x2="563" y2="243" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="288" font-size="9" fill="#ca8a04">stored data</text>

  <!-- Remotive → System -->
  <line x1="160" y1="88" x2="265" y2="150" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="185" y="118" font-size="9" fill="#059669">job listings</text>

  <!-- System → Remotive -->
  <line x1="260" y1="142" x2="157" y2="96" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="140" font-size="9" fill="#059669">search queries</text>
</svg>
