<svg width="820" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 3.3 — Level-1 Data Flow Diagram</text>

  <!-- ══ External Entities (left column) ══ -->
  <rect x="10" y="50" width="110" height="40" rx="5" fill="#1e3a8a"/>
  <text x="65" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="white">End User</text>
  <text x="65" y="82" text-anchor="middle" font-size="8.5" fill="#bfdbfe">(Browser)</text>

  <rect x="10" y="200" width="110" height="40" rx="5" fill="#15803d"/>
  <text x="65" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Admin User</text>
  <text x="65" y="230" text-anchor="middle" font-size="8.5" fill="#dcfce7">(Browser)</text>

  <!-- ══ External Entities (right column) ══ -->
  <rect x="700" y="130" width="110" height="40" rx="5" fill="#5b21b6"/>
  <text x="755" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Groq AI API</text>
  <text x="755" y="162" text-anchor="middle" font-size="8.5" fill="#e9d5ff">LLaMA 3.3 70B</text>

  <rect x="700" y="210" width="110" height="40" rx="5" fill="#0369a1"/>
  <text x="755" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Remotive API</text>
  <text x="755" y="242" text-anchor="middle" font-size="8.5" fill="#e0f2fe">Job listings</text>

  <!-- ══ Data stores ══ -->
  <!-- DS1: MongoDB -->
  <rect x="680" y="310" width="130" height="34" rx="0" fill="none" stroke="#ca8a04" stroke-width="1.8"/>
  <line x1="680" y1="310" x2="680" y2="344" stroke="#ca8a04" stroke-width="1.8"/>
  <line x1="810" y1="310" x2="810" y2="344" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="745" y="331" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">DS-1: MongoDB Atlas</text>

  <!-- ══ Process circles ══ -->
  <!-- P1 Auth -->
  <ellipse cx="250" cy="70" rx="90" ry="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">1.0</text>
  <text x="250" y="78" text-anchor="middle" font-size="9" fill="#1e40af">Authentication</text>
  <text x="250" y="90" text-anchor="middle" font-size="8.5" fill="#2563eb">NextAuth + bcrypt</text>

  <!-- P2 Resume Editing -->
  <ellipse cx="250" cy="200" rx="100" ry="32" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">2.0</text>
  <text x="250" y="208" text-anchor="middle" font-size="9" fill="#15803d">Resume Editing</text>
  <text x="250" y="220" text-anchor="middle" font-size="8.5" fill="#16a34a">Editor + Preview + Redux</text>

  <!-- P3 Template & PDF -->
  <ellipse cx="480" cy="200" rx="100" ry="32" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">3.0</text>
  <text x="480" y="208" text-anchor="middle" font-size="9" fill="#92400e">Template Rendering</text>
  <text x="480" y="220" text-anchor="middle" font-size="8.5" fill="#d97706">6 templates + html2pdf.js</text>

  <!-- P4 AI Processing -->
  <ellipse cx="480" cy="130" rx="100" ry="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#5b21b6">4.0</text>
  <text x="480" y="138" text-anchor="middle" font-size="9" fill="#5b21b6">AI Processing</text>
  <text x="480" y="150" text-anchor="middle" font-size="8.5" fill="#7c3aed">5 AI actions / Groq proxy</text>

  <!-- P5 Cover Letters -->
  <ellipse cx="250" cy="320" rx="90" ry="30" fill="#fdf2f8" stroke="#a21caf" stroke-width="2"/>
  <text x="250" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#86198f">5.0</text>
  <text x="250" y="328" text-anchor="middle" font-size="9" fill="#86198f">Cover Letters</text>
  <text x="250" y="340" text-anchor="middle" font-size="8.5" fill="#a21caf">AI-generated + stored</text>

  <!-- P6 Job Tracking -->
  <ellipse cx="250" cy="430" rx="90" ry="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="250" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">6.0</text>
  <text x="250" y="438" text-anchor="middle" font-size="9" fill="#0369a1">Job Tracking</text>
  <text x="250" y="450" text-anchor="middle" font-size="8.5" fill="#0284c7">Kanban board / 6 statuses</text>

  <!-- P7 Job Discovery -->
  <ellipse cx="480" cy="300" rx="100" ry="30" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="480" y="295" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">7.0</text>
  <text x="480" y="308" text-anchor="middle" font-size="9" fill="#065f46">Job Discovery</text>
  <text x="480" y="320" text-anchor="middle" font-size="8.5" fill="#059669">Remotive API integration</text>

  <!-- P8 Admin -->
  <ellipse cx="480" cy="430" rx="100" ry="30" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">8.0</text>
  <text x="480" y="438" text-anchor="middle" font-size="9" fill="#991b1b">Admin Module</text>
  <text x="480" y="450" text-anchor="middle" font-size="8.5" fill="#dc2626">Users / Stats / Activity Logs</text>

  <!-- ══ Flow arrows ══ -->
  <!-- User → Auth -->
  <line x1="120" y1="70" x2="160" y2="70" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="140" y="64" font-size="8" fill="#475569">credentials</text>

  <!-- Auth → User (session) -->
  <line x1="160" y1="82" x2="120" y2="82" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="140" y="95" font-size="8" fill="#475569">JWT session</text>

  <!-- Auth → DB -->
  <line x1="290" y1="95" x2="690" y2="315" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="480" y="210" font-size="8" fill="#ca8a04"></text>

  <!-- User → Resume Editing -->
  <line x1="120" y1="195" x2="150" y2="195" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="125" y="190" font-size="8" fill="#475569">resume data</text>

  <!-- Resume → Template -->
  <line x1="350" y1="200" x2="380" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="355" y="194" font-size="8" fill="#475569">ResumeData</text>

  <!-- Resume → AI -->
  <line x1="310" y1="178" x2="380" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="330" y="155" font-size="8" fill="#475569">context</text>

  <!-- AI → Groq -->
  <line x1="580" y1="130" x2="700" y2="150" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="625" y="133" font-size="8" fill="#7c3aed">API call</text>

  <!-- Groq → AI (response) -->
  <line x1="700" y1="162" x2="580" y2="142" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="620" y="165" font-size="8" fill="#7c3aed">AI text/JSON</text>

  <!-- Template → User (PDF/preview) -->
  <line x1="420" y1="218" x2="370" y2="218" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="385" y="232" font-size="8" fill="#475569">live preview / PDF</text>

  <!-- Job Discovery → Remotive -->
  <line x1="580" y1="300" x2="700" y2="225" stroke="#059669" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="640" y="255" font-size="8" fill="#059669">GET jobs</text>

  <!-- Remotive → Job Discovery -->
  <line x1="700" y1="235" x2="580" y2="308" stroke="#059669" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="638" y="285" font-size="8" fill="#059669">job listings</text>

  <!-- Admin → DB -->
  <line x1="550" y1="450" x2="690" y2="328" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- All processes → DB (small labels) -->
  <text x="700" y="300" font-size="8.5" fill="#ca8a04">All processes read</text>
  <text x="700" y="312" font-size="8.5" fill="#ca8a04">/ write MongoDB</text>

  <!-- User → Admin note -->
  <line x1="120" y1="215" x2="150" y2="315" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="65" y="280" font-size="8" fill="#475569">cover letter</text>
  <text x="65" y="290" font-size="8" fill="#475569">data</text>

  <line x1="120" y1="225" x2="150" y2="425" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="25" y="380" font-size="8" fill="#475569">job app</text>
  <text x="25" y="390" font-size="8" fill="#475569">data</text>

  <!-- Admin User → Admin module -->
  <line x1="120" y1="220" x2="375" y2="425" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="210" y="338" font-size="8" fill="#dc2626">admin actions</text>
</svg>
