<svg width="820" height="540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 7.6 — Quick Cover Letter Generator Modal</text>

  <!-- Dim overlay background -->
  <rect x="10" y="30" width="800" height="500" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Editor page in background (blurred/dimmed) -->
  <rect x="10" y="30" width="800" height="500" fill="#0f172a" opacity="0.45" rx="6"/>

  <!-- Modal container -->
  <rect x="80" y="50" width="660" height="460" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.8"/>

  <!-- Modal header -->
  <rect x="80" y="50" width="660" height="52" rx="12" fill="#2563eb"/>
  <rect x="80" y="90" width="660" height="12" fill="#2563eb"/>
  <text x="260" y="80" font-size="13" font-weight="bold" fill="white">💌  Quick Cover Letter Generator</text>
  <text x="700" y="80" font-size="16" fill="white" font-weight="bold" style="cursor:pointer">×</text>
  <text x="260" y="94" font-size="8" fill="#bfdbfe">AI-powered using your resume data  •  Powered by Groq LLaMA 3.3 70B</text>

  <!-- Left column: inputs -->
  <rect x="92" y="110" width="300" height="385" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="108" y="130" font-size="10" font-weight="bold" fill="#374151">Job Details</text>

  <text x="108" y="150" font-size="8.5" fill="#6b7280">Job Title *</text>
  <rect x="108" y="154" width="272" height="24" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="170" font-size="8.5" fill="#374151">Frontend Engineer</text>

  <text x="108" y="192" font-size="8.5" fill="#6b7280">Company Name *</text>
  <rect x="108" y="196" width="272" height="24" rx="6" fill="white" stroke="#e2e8f0"/>
  <text x="118" y="211" font-size="8.5" fill="#374151">TechCorp Pvt Ltd</text>

  <text x="108" y="234" font-size="8.5" fill="#6b7280">Job Description (paste for better results)</text>
  <rect x="108" y="238" width="272" height="80" rx="6" fill="white" stroke="#e2e8f0"/>
  <text x="118" y="255" font-size="7.5" fill="#374151">We are looking for a skilled Frontend</text>
  <text x="118" y="267" font-size="7.5" fill="#374151">Engineer with React, TypeScript and</text>
  <text x="118" y="279" font-size="7.5" fill="#374151">Next.js experience to join our...</text>
  <text x="118" y="291" font-size="7.5" fill="#94a3b8">...</text>

  <text x="108" y="336" font-size="8.5" fill="#6b7280">Tone</text>
  <rect x="108" y="340" width="272" height="24" rx="6" fill="white" stroke="#e2e8f0"/>
  <text x="118" y="356" font-size="8.5" fill="#374151">Professional  ▾</text>

  <text x="108" y="382" font-size="8" fill="#94a3b8">✓ Include skills from resume automatically</text>
  <text x="108" y="396" font-size="8" fill="#94a3b8">✓ Match job keywords (ATS-friendly)</text>

  <rect x="108" y="410" width="272" height="28" rx="14" fill="#2563eb"/>
  <text x="244" y="429" text-anchor="middle" font-size="9.5" font-weight="bold" fill="white">✨  Generate Cover Letter</text>
  <text x="108" y="464" font-size="7.5" fill="#94a3b8">Resume used: Senior Dev Resume  (change ↗)</text>
  <text x="108" y="477" font-size="7.5" fill="#94a3b8">Approx. generation time: ~4 seconds</text>

  <!-- Right column: output preview -->
  <rect x="404" y="110" width="324" height="385" rx="8" fill="white" stroke="#e2e8f0"/>
  <text x="420" y="130" font-size="10" font-weight="bold" fill="#374151">Generated Cover Letter</text>
  <!-- Toolbar -->
  <rect x="556" y="118" width="55" height="18" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="583" y="131" text-anchor="middle" font-size="8" fill="#166534">✓ Generated</text>
  <rect x="618" y="118" width="50" height="18" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="643" y="131" text-anchor="middle" font-size="8" fill="#6b7280">⇓ Copy</text>
  <rect x="674" y="118" width="42" height="18" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="695" y="131" text-anchor="middle" font-size="8" fill="#6b7280">🖨 PDF</text>

  <!-- Cover letter text content -->
  <rect x="412" y="140" width="308" height="340" rx="6" fill="#fafafa" stroke="#f1f5f9"/>
  <text x="424" y="158" font-size="8" fill="#374151" font-weight="bold">Maria Ahmed</text>
  <text x="424" y="170" font-size="7.5" fill="#6b7280">maria@example.com  |  +92-300-1234567</text>
  <text x="424" y="186" font-size="7.5" fill="#374151">January 21, 2025</text>
  <text x="424" y="202" font-size="7.5" fill="#374151">Hiring Manager</text>
  <text x="424" y="214" font-size="7.5" fill="#374151">TechCorp Pvt Ltd</text>
  <text x="424" y="230" font-size="7.5" fill="#374151" font-weight="bold">Re: Frontend Engineer Position</text>
  <line x1="420" y1="238" x2="714" y2="238" stroke="#e2e8f0"/>
  <text x="424" y="253" font-size="7.5" fill="#374151">Dear Hiring Manager,</text>
  <text x="424" y="268" font-size="7.5" fill="#374151">I am excited to apply for the Frontend Engineer</text>
  <text x="424" y="280" font-size="7.5" fill="#374151">position at TechCorp. With 3+ years of experience</text>
  <text x="424" y="292" font-size="7.5" fill="#374151">in React, TypeScript, and Next.js, I have delivered</text>
  <text x="424" y="304" font-size="7.5" fill="#374151">high-quality web applications that serve thousands</text>
  <text x="424" y="316" font-size="7.5" fill="#374151">of daily active users...</text>
  <text x="424" y="334" font-size="7.5" fill="#374151">My proficiency in Redux Toolkit, REST APIs and</text>
  <text x="424" y="346" font-size="7.5" fill="#374151">agile workflows aligns with your requirements...</text>
  <text x="424" y="364" font-size="7.5" fill="#374151">I look forward to the opportunity to contribute</text>
  <text x="424" y="376" font-size="7.5" fill="#374151">to TechCorp's innovative products...</text>
  <text x="424" y="396" font-size="7.5" fill="#374151">Warm regards,</text>
  <text x="424" y="408" font-size="7.5" fill="#374151" font-weight="bold">Maria Ahmed</text>
  <text x="424" y="424" font-size="7" fill="#94a3b8">~350 words  •  Professional tone  •  ATS-optimized</text>
  <!-- Regenerate button -->
  <rect x="412" y="436" width="140" height="20" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="482" y="450" text-anchor="middle" font-size="8" fill="#7c3aed">↺ Regenerate</text>
  <rect x="558" y="436" width="140" height="20" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="628" y="450" text-anchor="middle" font-size="8" fill="#15803d">💾 Save to Library</text>
</svg>
