<svg width="820" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 6.1 — Deployment &amp; Infrastructure Architecture</text>

  <!-- User/Browser -->
  <rect x="20" y="55" width="100" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="70" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">End User</text>
  <text x="70" y="93" text-anchor="middle" font-size="8" fill="#1e40af">Browser /</text>
  <text x="70" y="105" text-anchor="middle" font-size="8" fill="#1e40af">Mobile Client</text>

  <!-- HTTPS arrow -->
  <line x1="120" y1="85" x2="160" y2="85" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="140" y="80" text-anchor="middle" font-size="7.5" fill="#2563eb">HTTPS</text>

  <!-- Vercel CDN / Edge Network -->
  <rect x="160" y="38" width="200" height="100" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.8"/>
  <text x="260" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">Vercel Platform</text>
  <rect x="173" y="65" width="80" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="213" y="79" text-anchor="middle" font-size="8" fill="#1e40af">CDN Edge</text>
  <text x="213" y="91" text-anchor="middle" font-size="7.5" fill="#1e40af">Static Assets</text>
  <rect x="267" y="65" width="80" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="307" y="79" text-anchor="middle" font-size="8" fill="#1e40af">Serverless</text>
  <text x="307" y="91" text-anchor="middle" font-size="7.5" fill="#1e40af">Functions</text>
  <text x="260" y="128" text-anchor="middle" font-size="7.5" fill="#0369a1">Next.js 16 App Router  •  Node.js runtime</text>

  <!-- Arrow to Next.js runtime box -->
  <line x1="360" y1="85" x2="405" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Next.js App -->
  <rect x="405" y="38" width="200" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="505" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#5b21b6">Next.js Application</text>
  <rect x="417" y="65" width="80" height="30" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="457" y="80" text-anchor="middle" font-size="7.5" fill="#5b21b6">App Router</text>
  <text x="457" y="91" text-anchor="middle" font-size="7" fill="#5b21b6">RSC + Client</text>
  <rect x="512" y="65" width="80" height="30" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="552" y="80" text-anchor="middle" font-size="7.5" fill="#5b21b6">API Routes</text>
  <text x="552" y="91" text-anchor="middle" font-size="7" fill="#5b21b6">/api/**</text>
  <text x="505" y="128" text-anchor="middle" font-size="7.5" fill="#5b21b6">NextAuth v5  •  Redux  •  Tailwind CSS 4</text>

  <!-- Arrow down to MongoDB -->
  <line x1="505" y1="138" x2="505" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="162" font-size="7.5" fill="#6b7280">Mongoose ODM</text>

  <!-- MongoDB Atlas -->
  <rect x="355" y="175" width="300" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="505" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">MongoDB Atlas</text>
  <text x="505" y="210" text-anchor="middle" font-size="8" fill="#15803d">M0 Free Tier  •  ap-southeast-1 cluster</text>
  <rect x="368" y="216" width="65" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="400" y="231" text-anchor="middle" font-size="7.5" fill="#15803d">users</text>
  <rect x="440" y="216" width="65" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="472" y="231" text-anchor="middle" font-size="7.5" fill="#15803d">resumes</text>
  <rect x="512" y="216" width="65" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="544" y="231" text-anchor="middle" font-size="7.5" fill="#15803d">jobs</text>
  <rect x="584" y="216" width="60" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="614" y="231" text-anchor="middle" font-size="7.5" fill="#15803d">+3 more</text>
  <text x="505" y="256" text-anchor="middle" font-size="7.5" fill="#15803d">Auto-scaling  •  TLS encryption  •  Connection pooling  •  Atlas backups</text>

  <!-- External APIs -->
  <!-- Groq API -->
  <rect x="615" y="38" width="185" height="70" rx="10" fill="#fdf2f8" stroke="#a21caf" stroke-width="1.8"/>
  <text x="707" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#86198f">Groq Cloud API</text>
  <text x="707" y="73" text-anchor="middle" font-size="8" fill="#86198f">LLaMA 3.3 70B model</text>
  <text x="707" y="87" text-anchor="middle" font-size="8" fill="#86198f">5 AI actions via /api/ai</text>
  <text x="707" y="99" text-anchor="middle" font-size="7.5" fill="#a855f7">api.groq.com/openai/v1</text>

  <!-- Remotive API -->
  <rect x="615" y="122" width="185" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="707" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Remotive API</text>
  <text x="707" y="157" text-anchor="middle" font-size="8" fill="#92400e">Remote job listings</text>
  <text x="707" y="169" text-anchor="middle" font-size="7.5" fill="#b45309">remotive.com/api</text>

  <!-- Arrows from Next.js to external -->
  <line x1="605" y1="72" x2="615" y2="72" stroke="#a21caf" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="110" x2="615" y2="152" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CI/CD section -->
  <rect x="20" y="175" width="320" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.8"/>
  <text x="180" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">CI/CD Pipeline</text>

  <rect x="32" y="205" width="85" height="28" rx="6" fill="#0f172a"/>
  <text x="74" y="217" text-anchor="middle" font-size="8" fill="white">GitHub Repo</text>
  <text x="74" y="228" text-anchor="middle" font-size="7.5" fill="#94a3b8">move-to-full-stack</text>

  <line x1="117" y1="218" x2="135" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="126" y="214" text-anchor="middle" font-size="7" fill="#94a3b8">push</text>

  <rect x="135" y="205" width="85" height="28" rx="6" fill="#e2e8f0"/>
  <text x="177" y="217" text-anchor="middle" font-size="8" fill="#374151">Vercel Auto</text>
  <text x="177" y="228" text-anchor="middle" font-size="7.5" fill="#6b7280">Preview Deploy</text>

  <line x1="220" y1="218" x2="238" y2="218" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="229" y="213" text-anchor="middle" font-size="7" fill="#16a34a">merge</text>

  <rect x="238" y="205" width="85" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="280" y="217" text-anchor="middle" font-size="8" fill="#15803d">Production</text>
  <text x="280" y="228" text-anchor="middle" font-size="7.5" fill="#15803d">Deployment</text>

  <text x="180" y="254" text-anchor="middle" font-size="7.5" fill="#6b7280">Automatic preview URL per PR  •  Zero-downtime deploys  •  Rollback on failure</text>

  <!-- Environment Variables section -->
  <rect x="20" y="280" width="320" height="100" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.8"/>
  <text x="180" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Environment Variables (Vercel Secrets)</text>
  <text x="36" y="318" font-size="8.5" fill="#374151">MONGODB_URI</text>
  <text x="200" y="318" font-size="8" fill="#94a3b8">mongodb+srv://atlas/...</text>
  <text x="36" y="333" font-size="8.5" fill="#374151">NEXTAUTH_SECRET</text>
  <text x="200" y="333" font-size="8" fill="#94a3b8">JWT signing key</text>
  <text x="36" y="348" font-size="8.5" fill="#374151">GROQ_API_KEY</text>
  <text x="200" y="348" font-size="8" fill="#94a3b8">gsk_xxxx (server-only)</text>
  <text x="36" y="363" font-size="8.5" fill="#374151">NEXTAUTH_URL</text>
  <text x="200" y="363" font-size="8" fill="#94a3b8">https://your-app.vercel.app</text>
  <text x="36" y="375" font-size="7.5" fill="#d97706">All secrets are server-side only — never exposed to the browser</text>

  <!-- Performance metrics -->
  <rect x="355" y="280" width="445" height="100" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.8"/>
  <text x="577" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">Performance &amp; Scaling Characteristics</text>
  <text x="370" y="320" font-size="8.5" fill="#374151">Cold start (Serverless):</text>
  <text x="520" y="320" font-size="8.5" fill="#0369a1">~200–400ms (cached: &lt;50ms)</text>
  <text x="370" y="335" font-size="8.5" fill="#374151">MongoDB connection:</text>
  <text x="520" y="335" font-size="8.5" fill="#0369a1">Connection pooling via cached client</text>
  <text x="370" y="350" font-size="8.5" fill="#374151">AI generation (Groq):</text>
  <text x="520" y="350" font-size="8.5" fill="#0369a1">~4–8s streaming response</text>
  <text x="370" y="365" font-size="8.5" fill="#374151">PDF export:</text>
  <text x="520" y="365" font-size="8.5" fill="#0369a1">~2.4s client-side (html2pdf.js)</text>
  <text x="370" y="378" font-size="7.5" fill="#94a3b8">Vercel Edge CDN — global PoPs  •  MongoDB Atlas auto-scales read replicas on demand</text>

  <!-- Security callout -->
  <rect x="20" y="396" width="780" height="38" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="410" y="412" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Security Controls</text>
  <text x="36" y="426" font-size="8" fill="#7f1d1d">JWT httpOnly cookies  |  bcrypt passwords (salt 12)  |  Zod input validation  |  requireAdmin() RBAC gate  |  HTTPS-only  |  No secrets in client bundle</text>
</svg>
