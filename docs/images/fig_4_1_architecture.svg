<svg width="820" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 4.1 — Full-Stack System Architecture</text>

  <!-- Layer 1: Presentation -->
  <rect x="30" y="45" width="760" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="65" font-size="11" font-weight="bold" fill="#1e40af">PRESENTATION LAYER  (React 19 + Tailwind CSS 4 + Redux Toolkit)</text>
  <rect x="50" y="75" width="120" height="38" rx="5" fill="#2563eb" stroke="none"/>
  <text x="110" y="98" text-anchor="middle" font-size="10" fill="white">Resume Editor</text>
  <rect x="185" y="75" width="120" height="38" rx="5" fill="#2563eb"/>
  <text x="245" y="98" text-anchor="middle" font-size="10" fill="white">Job Tracker</text>
  <rect x="320" y="75" width="120" height="38" rx="5" fill="#2563eb"/>
  <text x="380" y="98" text-anchor="middle" font-size="10" fill="white">Cover Letter</text>
  <rect x="455" y="75" width="120" height="38" rx="5" fill="#2563eb"/>
  <text x="515" y="98" text-anchor="middle" font-size="10" fill="white">Interview Prep</text>
  <rect x="590" y="75" width="120" height="38" rx="5" fill="#2563eb"/>
  <text x="650" y="98" text-anchor="middle" font-size="10" fill="white">Admin Dashboard</text>
  <text x="730" y="98" text-anchor="middle" font-size="10" fill="#1e40af">+ more</text>
  <text x="410" y="144" text-anchor="middle" font-size="9" fill="#1e40af">All pages share a global Navbar, DarkModeApplier, and Redux + NextAuth session providers</text>

  <!-- Arrow 1→2 -->
  <line x1="410" y1="155" x2="410" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="425" y="170" font-size="9" fill="#64748b">HTTP / fetch()</text>

  <!-- Layer 2: API -->
  <rect x="30" y="180" width="760" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="200" font-size="11" font-weight="bold" fill="#15803d">API LAYER  (Next.js 16 App Router — Route Handlers)</text>
  <rect x="50" y="210" width="105" height="38" rx="5" fill="#16a34a"/>
  <text x="102" y="229" text-anchor="middle" font-size="9.5" fill="white">/api/auth/*</text>
  <text x="102" y="242" text-anchor="middle" font-size="8.5" fill="#dcfce7">NextAuth</text>
  <rect x="168" y="210" width="105" height="38" rx="5" fill="#16a34a"/>
  <text x="220" y="229" text-anchor="middle" font-size="9.5" fill="white">/api/resumes/*</text>
  <text x="220" y="242" text-anchor="middle" font-size="8.5" fill="#dcfce7">CRUD + versions</text>
  <rect x="286" y="210" width="105" height="38" rx="5" fill="#16a34a"/>
  <text x="338" y="229" text-anchor="middle" font-size="9.5" fill="white">/api/ai</text>
  <text x="338" y="242" text-anchor="middle" font-size="8.5" fill="#dcfce7">Groq proxy</text>
  <rect x="404" y="210" width="105" height="38" rx="5" fill="#16a34a"/>
  <text x="456" y="229" text-anchor="middle" font-size="9.5" fill="white">/api/jobs/*</text>
  <text x="456" y="242" text-anchor="middle" font-size="8.5" fill="#dcfce7">Tracker CRUD</text>
  <rect x="522" y="210" width="125" height="38" rx="5" fill="#16a34a"/>
  <text x="584" y="229" text-anchor="middle" font-size="9.5" fill="white">/api/cover-letters/*</text>
  <text x="584" y="242" text-anchor="middle" font-size="8.5" fill="#dcfce7">CRUD</text>
  <rect x="660" y="210" width="115" height="38" rx="5" fill="#15803d"/>
  <text x="717" y="229" text-anchor="middle" font-size="9.5" fill="white">/api/admin/*</text>
  <text x="717" y="242" text-anchor="middle" font-size="8.5" fill="#dcfce7">Admin-only routes</text>
  <text x="410" y="278" text-anchor="middle" font-size="9" fill="#15803d">All routes: auth() session check → Zod validation → Mongoose ODM → NextResponse.json()</text>

  <!-- Arrow 2→3 -->
  <line x1="300" y1="290" x2="300" y2="313" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="188" y="305" font-size="9" fill="#64748b">Mongoose ODM queries</text>

  <!-- Layer 3: Data -->
  <rect x="30" y="315" width="490" height="110" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="50" y="335" font-size="11" font-weight="bold" fill="#92400e">DATA LAYER  (MongoDB Atlas)</text>
  <rect x="50" y="345" width="80" height="38" rx="5" fill="#ca8a04"/>
  <text x="90" y="368" text-anchor="middle" font-size="9.5" fill="white">Users</text>
  <rect x="142" y="345" width="80" height="38" rx="5" fill="#ca8a04"/>
  <text x="182" y="368" text-anchor="middle" font-size="9.5" fill="white">Resumes</text>
  <rect x="234" y="345" width="80" height="38" rx="5" fill="#ca8a04"/>
  <text x="274" y="362" text-anchor="middle" font-size="9.5" fill="white">Cover</text>
  <text x="274" y="375" text-anchor="middle" font-size="9.5" fill="white">Letters</text>
  <rect x="326" y="345" width="80" height="38" rx="5" fill="#ca8a04"/>
  <text x="366" y="368" text-anchor="middle" font-size="9.5" fill="white">Jobs</text>
  <rect x="418" y="345" width="90" height="38" rx="5" fill="#b45309"/>
  <text x="463" y="362" text-anchor="middle" font-size="9.5" fill="white">Activity</text>
  <text x="463" y="375" text-anchor="middle" font-size="9.5" fill="white">Logs</text>
  <text x="275" y="408" text-anchor="middle" font-size="9" fill="#92400e">+  SystemSettings collection  |  All indexed on userId  |  Mongoose schemas with validation</text>

  <!-- Arrow 2→External -->
  <line x1="620" y1="290" x2="620" y2="313" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: External -->
  <rect x="540" y="315" width="250" height="110" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="665" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">EXTERNAL SERVICES</text>
  <rect x="556" y="345" width="105" height="38" rx="5" fill="#7c3aed"/>
  <text x="608" y="362" text-anchor="middle" font-size="9.5" fill="white">Groq AI API</text>
  <text x="608" y="375" text-anchor="middle" font-size="8.5" fill="#e9d5ff">LLaMA 3.3 70B</text>
  <rect x="672" y="345" width="105" height="38" rx="5" fill="#7c3aed"/>
  <text x="724" y="362" text-anchor="middle" font-size="9.5" fill="white">Remotive API</text>
  <text x="724" y="375" text-anchor="middle" font-size="8.5" fill="#e9d5ff">Remote Jobs</text>

  <!-- Legend -->
  <rect x="30" y="440" width="760" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="457" font-size="9" font-weight="bold" fill="#475569">KEY FLOW:</text>
  <text x="50" y="476" font-size="9" fill="#475569">Browser → fetch() → Next.js Route Handler → Session verify → Mongoose → MongoDB Atlas  |  AI actions: Route Handler → Groq SDK → Groq API</text>

  <!-- Bottom note -->
  <text x="410" y="530" text-anchor="middle" font-size="9" fill="#94a3b8">Next.js 16 App Router co-locates all layers within one monorepo. Deployment: Vercel (serverless) + MongoDB Atlas (managed cloud)</text>
</svg>
