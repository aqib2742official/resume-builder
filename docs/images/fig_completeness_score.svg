<svg width="820" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Figure 5.6 — Resume Completeness Score Algorithm</text>

  <!-- Input box -->
  <rect x="30" y="45" width="160" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="110" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">ResumeData Input</text>
  <text x="45" y="83" font-size="8.5" fill="#1e40af">personal.fullName</text>
  <text x="45" y="97" font-size="8.5" fill="#1e40af">personal.email</text>
  <text x="45" y="111" font-size="8.5" fill="#1e40af">personal.summary</text>
  <text x="45" y="125" font-size="8.5" fill="#1e40af">experience[ ]</text>
  <text x="45" y="139" font-size="8.5" fill="#1e40af">education[ ]</text>
  <text x="45" y="153" font-size="8.5" fill="#1e40af">skills[ ] / certifications[ ]</text>

  <!-- Arrow -->
  <line x1="190" y1="105" x2="220" y2="105" stroke="#475569" stroke-width="1.5"/>
  <polygon points="216,101 224,105 216,109" fill="#475569"/>

  <!-- Section checks column -->
  <text x="420" y="45" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Section Checks (lib/completenessScore.ts)</text>

  <!-- Check rows -->
  <rect x="220" y="55" width="400" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="235" y="72" font-size="9" fill="#15803d">personal:</text>
  <text x="295" y="72" font-size="8.5" fill="#374151">fullName &amp;&amp; email &amp;&amp; phone  →</text>
  <rect x="530" y="59" width="40" height="18" rx="9" fill="#16a34a"/>
  <text x="550" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="white">25 pts</text>
  <text x="580" y="72" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <rect x="220" y="85" width="400" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="235" y="102" font-size="9" fill="#15803d">summary:</text>
  <text x="295" y="102" font-size="8.5" fill="#374151">summary.length &gt; 50 chars  →</text>
  <rect x="530" y="89" width="40" height="18" rx="9" fill="#16a34a"/>
  <text x="550" y="102" text-anchor="middle" font-size="9" font-weight="bold" fill="white">10 pts</text>
  <text x="580" y="102" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <rect x="220" y="115" width="400" height="26" rx="5" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="235" y="132" font-size="9" fill="#92400e">experience:</text>
  <text x="295" y="132" font-size="8.5" fill="#374151">experience.length ≥ 1  →</text>
  <rect x="530" y="119" width="40" height="18" rx="9" fill="#d97706"/>
  <text x="550" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="white">20 pts</text>
  <text x="580" y="132" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <rect x="220" y="145" width="400" height="26" rx="5" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="235" y="162" font-size="9" fill="#92400e">education:</text>
  <text x="295" y="162" font-size="8.5" fill="#374151">education.length ≥ 1  →</text>
  <rect x="530" y="149" width="40" height="18" rx="9" fill="#d97706"/>
  <text x="550" y="162" text-anchor="middle" font-size="9" font-weight="bold" fill="white">15 pts</text>
  <text x="580" y="162" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <rect x="220" y="175" width="400" height="26" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="235" y="192" font-size="9" fill="#5b21b6">skills:</text>
  <text x="295" y="192" font-size="8.5" fill="#374151">all skills count ≥ 3  →</text>
  <rect x="530" y="179" width="40" height="18" rx="9" fill="#7c3aed"/>
  <text x="550" y="192" text-anchor="middle" font-size="9" font-weight="bold" fill="white">15 pts</text>
  <text x="580" y="192" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <rect x="220" y="205" width="400" height="26" rx="5" fill="#fdf2f8" stroke="#f0abfc" stroke-width="1"/>
  <text x="235" y="222" font-size="9" fill="#86198f">projects:</text>
  <text x="295" y="222" font-size="8.5" fill="#374151">projects.length ≥ 1  →</text>
  <rect x="530" y="209" width="40" height="18" rx="9" fill="#a21caf"/>
  <text x="550" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="white">10 pts</text>
  <text x="580" y="222" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <rect x="220" y="235" width="400" height="26" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="235" y="252" font-size="9" fill="#0369a1">extras:</text>
  <text x="295" y="252" font-size="8.5" fill="#374151">certifications OR languages &gt; 0  →</text>
  <rect x="530" y="239" width="40" height="18" rx="9" fill="#0284c7"/>
  <text x="550" y="252" text-anchor="middle" font-size="9" font-weight="bold" fill="white">5 pts</text>
  <text x="580" y="252" font-size="8.5" fill="#94a3b8">(else 0)</text>

  <!-- Total -->
  <rect x="220" y="270" width="400" height="28" rx="5" fill="#0f172a"/>
  <text x="350" y="289" text-anchor="middle" font-size="9.5" font-weight="bold" fill="white">total = sum of all checks</text>
  <text x="460" y="289" font-size="9.5" fill="#94a3b8">(max 100 pts)</text>

  <!-- Output: score displays -->
  <line x1="630" y1="105" x2="660" y2="105" stroke="#475569" stroke-width="1.5"/>
  <polygon points="656,101 664,105 656,109" fill="#475569"/>

  <rect x="660" y="55" width="140" height="270" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="730" y="75" text-anchor="middle" font-size="9" font-weight="bold" fill="#374151">Score Outputs</text>

  <!-- Score bar: 85% -->
  <text x="675" y="96" font-size="8.5" fill="#374151">Example: 85%</text>
  <rect x="675" y="100" width="110" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="675" y="100" width="93" height="10" rx="5" fill="#16a34a"/>
  <rect x="680" y="116" width="45" height="16" rx="8" fill="#dcfce7"/>
  <text x="702" y="128" text-anchor="middle" font-size="8.5" fill="#15803d" font-weight="bold">85% ✓</text>
  <text x="675" y="148" font-size="7.5" fill="#6b7280">Green  ≥ 80%</text>

  <!-- Score bar: 62% -->
  <text x="675" y="166" font-size="8.5" fill="#374151">Example: 62%</text>
  <rect x="675" y="170" width="110" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="675" y="170" width="68" height="10" rx="5" fill="#d97706"/>
  <rect x="680" y="186" width="45" height="16" rx="8" fill="#fef3c7"/>
  <text x="702" y="198" text-anchor="middle" font-size="8.5" fill="#d97706" font-weight="bold">62% !</text>
  <text x="675" y="218" font-size="7.5" fill="#6b7280">Amber 50–79%</text>

  <!-- Score bar: 30% -->
  <text x="675" y="236" font-size="8.5" fill="#374151">Example: 30%</text>
  <rect x="675" y="240" width="110" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="675" y="240" width="33" height="10" rx="5" fill="#dc2626"/>
  <rect x="680" y="256" width="45" height="16" rx="8" fill="#fee2e2"/>
  <text x="702" y="268" text-anchor="middle" font-size="8.5" fill="#dc2626" font-weight="bold">30% ✗</text>
  <text x="675" y="288" font-size="7.5" fill="#6b7280">Red  &lt; 50%</text>

  <line x1="675" y1="300" x2="790" y2="300" stroke="#e2e8f0"/>
  <text x="730" y="316" text-anchor="middle" font-size="7.5" fill="#94a3b8">Shown on:</text>
  <text x="730" y="330" text-anchor="middle" font-size="7.5" fill="#94a3b8">• ResumeCard grid</text>
  <text x="730" y="344" text-anchor="middle" font-size="7.5" fill="#94a3b8">• Analytics page</text>

  <!-- Where used note -->
  <rect x="30" y="310" width="615" height="100" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="322" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Where the Score is Used</text>
  <text x="50" y="350" font-size="8.5" fill="#475569">1.  Resume card grid (/resumes) — color-coded badge and progress bar per card for at-a-glance quality comparison</text>
  <text x="50" y="366" font-size="8.5" fill="#475569">2.  Analytics page (/analytics) — full breakdown per section with actionable suggestions for improvement</text>
  <text x="50" y="382" font-size="8.5" fill="#475569">3.  Resume Comparison modal — side-by-side completeness scores used to highlight the stronger resume</text>
  <text x="50" y="398" font-size="8.5" fill="#475569">4.  Sorting in /resumes — users can sort the grid by completeness score to identify which resume needs the most work</text>
</svg>
